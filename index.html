<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TaskHero</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>🚀 TaskHero</h1>

<p class="subtitle">
أنجز مهامك وارفع مستواك
</p>

<div class="card">

<div class="stats">

<div>

<h3>المستوى</h3>
<p id="level">1</p>

</div>

<div>

<h3>XP</h3>
<p><span id="xp">0</span>/100</p>

</div>

<div>

<h3>الإنجاز</h3>
<p id="percent">0%</p>

</div>

</div>

<div class="bar">

<div id="progress"></div>

</div>

</div>

<div class="add">

<input id="taskInput" placeholder="اكتب مهمة">

<button id="addBtn">
إضافة
</button>

</div>

<ul id="tasks"></ul>

</div>

<script src="script.js"></script>

</body>

</html>
